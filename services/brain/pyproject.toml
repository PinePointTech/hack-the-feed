[project]
name = "mybuster-brain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14.6",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
